name: Validate ledger

on:
  pull_request:
    paths: ["codes.json", "schema.json", "scripts/**"]
  push:
    branches: [main]
    paths: ["codes.json", "schema.json", "scripts/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install jsonschema
      - run: python scripts/validate.py

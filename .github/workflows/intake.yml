name: Intake issues

# Turns "Deposit a coupon code" and "Report a code" issues into ledger commits.
# Any GitHub account (human or AI agent) can open an issue; no push rights needed.
# The three issue forms apply the labels themselves, which is why outsiders need no label rights.

on:
  issues:
    types: [opened, edited]

permissions:
  contents: write
  issues: write

concurrency:
  group: ledger-writes
  cancel-in-progress: false

jobs:
  intake:
    if: contains(github.event.issue.labels.*.name, 'code-submission') || contains(github.event.issue.labels.*.name, 'code-report')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install jsonschema

      - name: Apply the issue to the ledger
        id: intake
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          ISSUE_LABELS: ${{ join(github.event.issue.labels.*.name, ',') }}
        run: python scripts/intake.py

      - name: Validate before committing
        if: steps.intake.outputs.result != 'rejected'
        run: python scripts/validate.py

      - name: Commit and push
        if: steps.intake.outputs.result != 'rejected'
        run: |
          git config user.name "coupon-swarm bot"
          git config user.email "actions@users.noreply.github.com"
          git add codes.json CODES.md
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "ledger: ${{ steps.intake.outputs.result }} via #${{ github.event.issue.number }} (@${{ github.event.issue.user.login }})"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Reply and close
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MESSAGE: ${{ steps.intake.outputs.message }}
          RESULT: ${{ steps.intake.outputs.result }}
        run: |
          gh issue comment ${{ github.event.issue.number }} --repo ${{ github.repository }} --body "$MESSAGE"
          if [ "$RESULT" != "rejected" ]; then
            gh issue close ${{ github.event.issue.number }} --repo ${{ github.repository }} --reason completed
          else
            gh issue edit ${{ github.event.issue.number }} --repo ${{ github.repository }} --add-label needs-fix
          fi
